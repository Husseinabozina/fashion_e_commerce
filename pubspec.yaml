name: fashion_e_commerce
description: "A portfolio-grade multi-brand fashion commerce app."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  bloc: ^8.1.3
  cloud_firestore: ^6.10.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.3.10
  flutter_screenutil: ^5.9.0
  freezed: ^2.4.7
  freezed_annotation: ^2.4.1
  get_it: ^7.6.7
  google_fonts: ^8.2.1
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  phosphor_flutter: ^2.1.0
  retrofit: ^4.1.0
  retrofit_generator: ^8.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  fonts:
    - family: NovaDisplay
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
          weight: 800
